name: labspace-pages

# Publishes a static preview of the Labspace rendering of the lab (labspace-local/static) to
# GitHub Pages: the instructions in the Labspace interface, with a preview panel instead of a
# terminal. Enable Pages first: Settings → Pages → Source: "GitHub Actions". A repository has a
# single Pages site, so this replaces the simspace site of simspace-deploy.yaml if both run.
on:
  push:
    branches: [labspace-local-terminal]
    paths:
      - "instructions/**"
      - "labspace-local/static/**"
      - ".github/workflows/labspace-pages.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build the static Labspace
        run: node labspace-local/static/build.mjs --base "/${{ github.event.repository.name }}/" --out _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
